spring.application.name=customer-management-api
server.port=8080

customer.file.path=src/main/resources/customers.txt

#Logging
logging.level.root=info
logging.level.com.rsystems.customer.management=debug

spring.jackson.deserialization.fail-on-unknown-properties=true

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/customers_project
spring.datasource.username=postgres
spring.datasource.password=postgres

# Optional: Define the PostgreSQL driver class
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in the log
spring.jpa.show-sql=true

# Format the SQL output for readability
spring.jpa.properties.hibernate.format_sql=true

# Enable detailed Hibernate logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
